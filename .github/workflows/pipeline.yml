name: Run Data Pipeline
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Jurisdiction IDs, comma-separated; empty means all registered areas'
        required: false
        default: ''
      scrape_only:
        description: 'Collect source records without publishing issue data'
        type: boolean
        default: false
  schedule:
    - cron: '0 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: civic-data-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Collect and validate official sources
        env:
          JURISDICTION_INPUT: ${{ inputs.profiles }}
          SCRAPE_ONLY: ${{ inputs.scrape_only }}
        run: |
          args=()
          if [ -n "$JURISDICTION_INPUT" ]; then
            IFS=',' read -ra args <<< "$JURISDICTION_INPUT"
          fi
          if [ "$SCRAPE_ONLY" = "true" ]; then
            args+=(--scrape-only)
          fi
          python scripts/pipeline.py "${args[@]}"
      - run: python scripts/validate_data.py
        if: always()
      - name: Preserve collection status and publish validated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if ! git diff --cached --quiet; then
            git commit -m "Update civic data and source health"
            git push
          fi
  deploy:
    needs: pipeline
    if: success()
    uses: ./.github/workflows/deploy.yml
